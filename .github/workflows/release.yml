name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        shell: bash
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o fortnite-multi-tool.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: fortnite-multi-tool
          path: fortnite-multi-tool.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fortnite-multi-tool.exe
          generate_release_notes: true
